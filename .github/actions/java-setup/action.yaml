name: "Java setup"
description: "Common steps for Java setup"

inputs:
  project-path:
    description: 'Path to the Maven project to build or deploy'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'
        server-id: central
        server-username: CI_DEPLOY_USERNAME
        server-password: CI_DEPLOY_PASSWORD

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      env:
        cache-name: cache-mvn-deps
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles(format('{0}/pom.xml', inputs.project-path)) }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Show versions
      shell: bash
      run: |
        java -version
        mvn --version
