name: "Build CI/CD"
description: "Common Steps to Build and deploy Fluxnova Plugins"
inputs:
  branch:
    description: 'Branch name to determine build or deploy'
    required: false
    default: ''
  project-path:
    description: 'Path to the Maven project to build or deploy'
    required: true
runs:
  using: "composite"
  steps:
    - name: validate project path
      shell: bash
      run: |
        POM="${{ inputs.project-path }}/pom.xml"
        if [[ ! -f "$POM" ]]; then
          echo "Error: pom.xml not found in project path '${{ inputs.project-path }}'."
          exit 1
        fi
    - name: Build or Deploy
      shell: bash
      run: |
        if [[ "${{ inputs.branch }}" == "main" ]] || [[ "${{ inputs.branch }}" == test/* ]]; then
          mvn -f "${{ inputs.project-path }}/pom.xml" -B -e -U deploy -DskipTests=true -DskipITs=true
        else
          mvn -f "${{ inputs.project-path }}/pom.xml" -B -e -U clean install
        fi
