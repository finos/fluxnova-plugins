# Workflow: Mono-repo Release - Publish selected project to Maven Central
# Purpose: Release and publish Maven artifacts for a specific project to Sonatype OSSRH
# Triggers:
#   - Manual dispatch: select project + dry-run option
# Branch requirements:
#   - Must be on a release/* or hotfix/* branch
#   - release/* → major version increment
#   - hotfix/* → minor version increment
# Prerequisites:
#   - Project pom.xml must be on a *-SNAPSHOT version
#   - User must be on a valid release or hotfix branch

name: "Release - Mono-repo publish to Maven Central"

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  CI_GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project to release"
        required: true
        type: choice
        options:
          - fluxnova-backward-compatibility-plugin
          - agentic
          - agentic-subprocess
      dry-run:
        description: "Perform a dry run"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate-branch:
    name: "Validate branch And Obtain Project Metadata"
    runs-on: ubuntu-latest
    outputs:
      branch-name: ${{ steps.validate.outputs.branch-name }}
      branch-type: ${{ steps.validate.outputs.branch-type }}
      project-key: ${{ steps.resolve-project.outputs.project-key }}
      project-path: ${{ steps.resolve-project.outputs.project-path }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/config/projects.yaml
          sparse-checkout-cone-mode: false

      - name: Validate branch format
        id: validate
        shell: bash
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          # Check if branch matches release/* or hotfix/*
          if [[ "$BRANCH_NAME" == release/* ]]; then
            BRANCH_TYPE="release"
            echo "  Valid release branch: $BRANCH_NAME"
          elif [[ "$BRANCH_NAME" == hotfix/* ]]; then
            BRANCH_TYPE="hotfix"
            echo "  Valid hotfix branch: $BRANCH_NAME"
          elif [[ "$BRANCH_NAME" == feature/* ]]; then
            BRANCH_TYPE="release"
            echo "  TEST RLEASE USING FEATURE BRANCH as RELEASE BRANCH: $BRANCH_NAME"
          elif [[ "$BRANCH_NAME" == fidelity-contributions:feature/* ]]; then
            BRANCH_TYPE="release"
            echo "  TEST RLEASE USING FEATURE BRANCH as RELEASE BRANCH: $BRANCH_NAME"
          else
            echo "  ERROR: Invalid branch name '$BRANCH_NAME'"
            echo "  Branch must be 'release/*' or 'hotfix/*'"
            echo "  Current branch: $BRANCH_NAME"
            exit 1
          fi
          
          echo "branch-type=$BRANCH_TYPE" >> $GITHUB_OUTPUT

      - name: install yq dependency
        id: install-yq
        shell: bash
        run: |
            if ! command -v yq &> /dev/null; then
                echo "yq not found, installing..."
                sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
                sudo chmod +x /usr/bin/yq
            else
                echo "yq is already installed"
            fi
            echo "yq version: $(yq --version)"

      - name: Resolve project metadata for Project ${{ inputs.project }}
        id: resolve-project
        shell: bash
        run: |
          # Resolve project metadata from config
          PROJECT="${{ inputs.project }}"
          MAP_FILE=".github/config/projects.yaml"
          
          echo "Resolving project metadata for '$PROJECT' from mapping file '$MAP_FILE'"
          
          if [[ ! -f "$MAP_FILE" ]]; then
            echo "ERROR: Project mapping file '$MAP_FILE' not found"
            exit 1
          fi
          
          echo "Mapping file found : $MAP_FILE"
          
          #Extract Key
          PROJECT_KEY=$(yq -r ".projects.\"$PROJECT\".tagKey // \"\"" "$MAP_FILE" 2>/dev/null || echo "failed")
          
          if [[ -z "$PROJECT_KEY" || "$PROJECT_KEY" == "null" || "$PROJECT_KEY" == "failed" ]]; then
            echo "ERROR: Unknown project '$PROJECT' or missing tagKey in $MAP_FILE"
            exit 1
          fi
          
          echo "Resolved project key: $PROJECT_KEY"
          echo "project-key=$PROJECT_KEY" >> $GITHUB_OUTPUT
          
          #Extract Path
          PROJECT_PATH=$(yq -r ".projects.\"$PROJECT\".path // \"\"" "$MAP_FILE" 2>/dev/null || echo "failed")
          
          if [[ -z "$PROJECT_PATH" || "$PROJECT_PATH" == "null" || "$PROJECT_PATH" == "failed" ]]; then
            echo "ERROR: Unknown project '$PROJECT' or missing path in $MAP_FILE"
            exit 1
          fi
          
          echo "Resolved project path: $PROJECT_PATH"
          echo "project-path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"

  publish-central:
    name: "Release ${{ inputs.project }}"
    runs-on: ubuntu-latest
    needs: validate-branch
    outputs:
      release-version: ${{ steps.set-vars.outputs.release-version }}
      development-version: ${{ steps.set-vars.outputs.development-version }}
      tag: ${{ steps.set-vars.outputs.tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          server-id: ossrh
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
          gpg-private-key: ${{ secrets.CI_GPG_PRIVATE_KEY }}
          gpg-passphrase: CI_GPG_PASSPHRASE

      - name: Configure git
        uses: ./.github/actions/configure-git

      - name: Download deps and plugins
        run: |
          mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies \
            -f ${{ needs.validate-branch.outputs.project-path }}/pom.xml \
            -s ./settings.xml

      - name: Extract version and compute next development version
        id: set-vars
        shell: bash
        run: |
          PROJECT_PATH="${{ needs.validate-branch.outputs.project-path }}"
          BRANCH_TYPE="${{ needs.validate-branch.outputs.branch-type }}"
          PROJECT_KEY="${{ needs.validate-branch.outputs.project-key }}"
          
          echo "=== Extracting version from $PROJECT_PATH/pom.xml ==="
          echo "=== project key : $PROJECT_KEY ==="
          
          # Extract current version from project pom.xml
          currentVersion=$(mvn help:evaluate \
            -f "$PROJECT_PATH/pom.xml" \
            -Dexpression=project.version -q -DforceStdout)
          
          echo "Current version: $currentVersion"
          
          # Validate version is a snapshot
          if [[ ! "$currentVersion" =~ -SNAPSHOT$ ]]; then
            echo "ERROR: Current version '$currentVersion' is not a SNAPSHOT version"
            echo "Release workflow requires a *-SNAPSHOT version in pom.xml"
            exit 1
          fi
          
          # Remove -SNAPSHOT if present to get the release version
          releaseVersion=${currentVersion%-SNAPSHOT}
          
          echo "Release version: $releaseVersion"
          echo "release-version=$releaseVersion" >> $GITHUB_OUTPUT
          
          # Set tag name with project prefix
          TAG="${PROJECT_KEY}-v${releaseVersion}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"
          
          # Extract numeric components for computing next development version
          n=${releaseVersion//[!0-9]/ }
          a=(${n//\./ })
          
          # Determine version increment based on branch type
          if [[ "$BRANCH_TYPE" == "release" ]]; then
            # Major version increment for release branches
            nextMajor=$((${a[0]} + 1))
            developmentVersion="${nextMajor}.0.0-SNAPSHOT"
            echo "Branch type: Release - Incrementing major version"
            echo "  ${releaseVersion} → ${developmentVersion}"
          elif [[ "$BRANCH_TYPE" == "hotfix" ]]; then
            # Minor version increment for hotfix branches
            currentMajor=${a[0]}
            nextMinor=$((${a[1]} + 1))
            developmentVersion="${currentMajor}.${nextMinor}.0-SNAPSHOT"
            echo "Branch type: Hotfix - Incrementing minor version"
            echo "  ${releaseVersion} → ${developmentVersion}"
          fi
          
          echo "development-version=$developmentVersion" >> $GITHUB_OUTPUT
          
          # Set environment variables for use in later steps
          echo "RELEASE_VERSION=$releaseVersion" >> $GITHUB_ENV
          echo "DEVELOPMENT_VERSION=$developmentVersion" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Generate release plan (dry-run artifact)
        shell: bash
        run: |
          cat > release-plan.json << EOF
          {
            "project": "${{ inputs.project }}",
            "project-path": "${{ needs.validate-branch.outputs.project-path }}",
            "project-key": "${{ needs.validate-branch.outputs.project-key }}",
            "branch": "${{ needs.validate-branch.outputs.branch-name }}",
            "branch-type": "${{ needs.validate-branch.outputs.branch-type }}",
            "current-version": "$(mvn help:evaluate -f ${{ needs.validate-branch.outputs.project-path }}/pom.xml -Dexpression=project.version -q -DforceStdout)",
            "release-version": "${{ env.RELEASE_VERSION }}",
            "development-version": "${{ env.DEVELOPMENT_VERSION }}",
            "tag": "${{ env.TAG }}",
            "dry-run": ${{ inputs.dry-run }},
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          
          echo "=== Release Plan ==="
          jq . release-plan.json

      - name: Upload release plan
        uses: actions/upload-artifact@v4
        with:
          name: release-plan-${{ inputs.project }}-${{ github.run_id }}
          path: release-plan.json
          retention-days: 3

      - name: Configure GitHub authentication for Maven Release Plugin
        if: ${{ !inputs.dry-run }}
        run: |
          git config --global url."https://${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Prepare release
        if: ${{ !inputs.dry-run && false }}
        run: |
          echo "=== Preparing Release ==="
          mvn -B \
            -f ${{ needs.validate-branch.outputs.project-path }}/pom.xml \
            -DautoVersionSubmodules=true \
            -DcommitByProject=false \
            -DpreparationGoals=clean \
            release:prepare \
            -DreleaseVersion=${{ env.RELEASE_VERSION }} \
            -DdevelopmentVersion=${{ env.DEVELOPMENT_VERSION }} \
            -Dtag=${{ env.TAG }} \
            -DignoreSnapshots=true \
            -DinteractiveMode=false \
            -s ./settings.xml

      - name: Perform release
        if: ${{ !inputs.dry-run && false }}
        run: |
          echo "=== Performing Release ==="
          mvn -B \
            -f ${{ needs.validate-branch.outputs.project-path }}/pom.xml \
            -DautoVersionSubmodules=true \
            -DcommitByProject=true \
            -DinteractiveMode=false \
            -DreleaseProfiles=release \
            -Dgoals='deploy org.sonatype.plugins:nexus-staging-maven-plugin:1.6.13:close' \
            -Darguments='-DautoVersionSubmodules=true -DcommitByProject=true -DreleasePerform=true -DskipTests -DskipITs' \
            release:perform \
            -s ./settings.xml

      - name: Print release summary
        if: ${{ !inputs.dry-run && false }}
        run: |
          echo "=== Release Complete ==="
          echo "Project  : ${{ inputs.project }}"
          echo "Version  : ${{ env.RELEASE_VERSION }}"
          echo "Tag      : ${{ env.TAG }}"
          echo "Next Dev : ${{ env.DEVELOPMENT_VERSION }}"
          echo ""
          echo "  Artifact published to Sonatype OSSRH"
          echo "  Tag '${{ env.TAG }}' created"
          echo "  Development version updated to ${{ env.DEVELOPMENT_VERSION }}"

      - name: Print dry-run summary
        if: ${{ inputs.dry-run }}
        run: |
          echo "=== DRY-RUN COMPLETE (No changes made) ==="
          echo ""
          jq . release-plan.json
          echo ""
          echo "Review the release plan above."
          echo "To proceed with actual release, run workflow again with:"
          echo "  - Same project: ${{ needs.validate-branch.outputs.project-path }}"
          echo "  - Same branch: ${{ needs.validate-branch.outputs.branch-name }}"
          echo "  - dry-run: false"